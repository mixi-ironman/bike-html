<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <div class="product-options__wrap">
            <h4 class="product-options__label" style="font-size: 16px">
                Size: <span class="product-options__item-value">M</span>
            </h4>
            <div class="product-options__list">
                <div class="product-options__type-item" data-size="s" title="Nhỏ">
                    <button class="product-options__item-btn">S</button>
                </div>
                <div class="product-options__type-item" data-size="m" title="Vừa">
                    <button class="product-options__item-btn active">M</button>
                </div>
                <div class="product-options__type-item" data-size="l" title="Lớn">
                    <button class="product-options__item-btn">L</button>
                </div>
            </div>
        </div>

        <div class="product-options__wrap">
            <h4 class="product-options__label" style="font-size: 16px">
                Trọng lượng: <span class="product-options__item-value">100kg</span>
            </h4>
            <div class="product-options__list">
                <div class="product-options__type-item" data-size="s" title="Nhỏ">
                    <button class="product-options__item-btn">200h</button>
                </div>
                <div class="product-options__type-item" data-size="m" title="Vừa">
                    <button class="product-options__item-btn active">200kg</button>
                </div>
                <div class="product-options__type-item" data-size="l" title="Lớn">
                    <button class="product-options__item-btn">200kg</button>
                </div>
            </div>
        </div>
    </body>
</html>
